<title>EinsteLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..800&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen app. Header / full-bleed neon field stage / bottom object tray. Single dark neon look by design. */
:root{--bg:#05060d;--pn:#0a0f1d;--pn2:#111a33;--ln:rgba(57,245,196,.2);--ln2:rgba(57,245,196,.5);--ac:#39f5c4;--ac2:#ff4fd8;--hi:#a9fff0;--tx:#dcfff7;--mu:#7f98a8;--N:#ff4f6e;--S:#4fb8ff;--au:#ffd23f;--bad:#ff6b6b;
--mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--logo:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;color-scheme:dark}
html{height:100%;background:var(--bg)}body{margin:0}
body{min-height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 var(--ui);display:flex;flex-direction:column;-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:8px;padding-block:8px;min-height:56px;border-bottom:1px solid var(--ln);background:var(--bg)}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.brand b{font:700 17px/1 var(--mono);letter-spacing:.2em;color:var(--ac);text-shadow:0 0 10px rgba(57,245,196,.55)}
.brand span{font:11px/1.2 var(--mono);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);display:grid;place-items:center;padding:0;flex:none}
.ib svg{width:20px;height:20px;stroke:var(--ac);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:rgba(57,245,196,.14);border-color:var(--ln2)}
#stage{flex:1 0 auto;min-height:440px;position:relative;overflow:hidden;background:var(--bg)}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block}
.chips{position:absolute;top:8px;left:0;right:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;z-index:3;pointer-events:none}
.chips::-webkit-scrollbar{display:none}
.chip{pointer-events:auto;flex:none;border:1px solid var(--ln);background:rgba(5,6,13,.78);color:var(--mu);border-radius:999px;padding:6px 11px;font:600 12px var(--mono)}
.chip.on{color:var(--bg);background:var(--ac);border-color:var(--ac);box-shadow:0 0 12px rgba(57,245,196,.4)}
.chip.e.on{background:var(--au);border-color:var(--au);box-shadow:0 0 12px rgba(255,210,63,.35)}
.pnl{background:rgba(9,13,26,.92);border:1px solid var(--ln2);border-radius:16px;box-shadow:0 0 18px rgba(57,245,196,.12),0 8px 24px rgba(0,0,0,.5)}
#xc{position:absolute;top:46px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:4;padding:9px 12px}
#xc .r1{display:flex;align-items:center;gap:8px}
#xc .r1 b{flex:1;min-width:0;font-size:14px}
.gr{font:700 10px var(--mono);color:var(--ac2);border:1px solid rgba(255,79,216,.5);border-radius:6px;padding:2px 5px;flex:none}
.law{font:13px var(--mono);color:var(--hi);margin-top:4px}
.chk{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font:12px var(--mono);color:var(--mu);font-variant-numeric:tabular-nums}
.chk b{color:var(--tx);font-weight:600}.chk .ok{color:var(--ac)}.chk .ap{color:var(--au)}
.note{font-size:12.5px;color:var(--mu);margin-top:6px;line-height:1.45}
.x{width:30px;height:30px;border-radius:9px;border:1px solid var(--ln);background:transparent;color:var(--mu);padding:0;flex:none;font-size:15px;line-height:1}
#sp{position:absolute;bottom:8px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:4;padding:8px 10px}
#sp .r1{display:flex;align-items:center;gap:6px}
#sp .nm{flex:1;min-width:0;display:flex;flex-direction:column}
#sp .nm b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sp .nm span{font:11px var(--mono);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--pn);padding:0;display:grid;place-items:center;flex:none}
.sb svg{width:18px;height:18px;stroke:var(--ac);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb.on{background:rgba(57,245,196,.16);border-color:var(--ln2)}
.sb.dl svg{stroke:var(--bad)}
.st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
.st div{background:rgba(57,245,196,.06);border-radius:8px;padding:4px 6px;min-width:0}
.st span{display:block;font:10px var(--mono);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{display:block;font:600 12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
#tray{border-top:1px solid var(--ln);background:var(--pn);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;gap:2px;padding-block:6px 2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:none;color:var(--mu);font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:8px 6px;border-radius:9px}
.tab.on{color:var(--ac);background:rgba(57,245,196,.1);text-shadow:0 0 8px rgba(57,245,196,.5)}
.items{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.items::-webkit-scrollbar{display:none}
.it{flex:none;width:68px;border:1px solid var(--ln);background:var(--bg);border-radius:14px;padding:5px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.it canvas{width:46px;height:34px;display:block}
.it span{font-size:10.5px;line-height:1.15;text-align:center;color:var(--tx);max-width:64px}
.it:active{transform:scale(.95);border-color:var(--ac)}
#bk{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#bk.o{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82%;overflow-y:auto;background:var(--pn);border-top:1px solid var(--ln2);border-radius:22px 22px 0 0;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
#sh.o{transform:none}
#sh .g{width:36px;height:4px;border-radius:2px;background:var(--ln2);margin:2px auto 12px}
#sh h2{margin:0 0 4px;font:700 16px var(--mono);letter-spacing:.06em;color:var(--ac)}
#sh h3{margin:16px 0 6px;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
#sh p{margin:4px 0;color:var(--mu);font-size:13px;line-height:1.45}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row label{flex:1;min-width:0;font-size:13.5px}
.row label small{display:block;font:11px var(--mono);color:var(--mu)}
.row output{font:600 13px var(--mono);color:var(--hi);min-width:84px;text-align:end;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ac);margin:2px 0 0}
.sl{margin:12px 0}
.sl .h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.sl .h output{font:600 13px var(--mono);color:var(--hi)}
.seg{display:flex;border:1px solid var(--ln2);border-radius:11px;overflow:hidden;flex:none}
.seg button{border:0;background:none;color:var(--mu);padding:7px 10px;font:600 12px var(--mono)}
.seg button.on{background:var(--ac);color:var(--bg)}
.btn{border:1px solid var(--ln2);background:transparent;color:var(--ac);border-radius:12px;padding:10px 14px;font:600 13px var(--mono)}
.btn.f{background:var(--ac);color:var(--bg)}
.btn.dl{color:var(--bad);border-color:rgba(255,107,107,.5)}
.bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ex{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:start;border:0;border-top:1px solid var(--ln);background:none;padding:11px 2px}
.ex .gr{margin-top:2px;min-width:34px;text-align:center}
.ex div{flex:1;min-width:0}
.ex b{display:block;font-size:14px}
.ex span{display:block;font:12px var(--mono);color:var(--mu);margin-top:2px}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;font:12.5px var(--mono);color:var(--bg);background:var(--ac);padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.o{opacity:1}
#err{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--bg);display:none;flex-direction:column;justify-content:center;gap:12px;color:var(--tx)}
#err pre{white-space:pre-wrap;font:12px var(--mono);color:var(--bad);background:var(--pn);padding:12px;border-radius:12px;max-height:40vh;overflow:auto}
[hidden]{display:none!important}
#lab{flex:1 0 auto;display:flex;flex-direction:column}
#labT{font-size:15px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home{flex:1 0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:18px}
.hb b{display:block;font:700 30px/1 var(--mono);letter-spacing:.22em;color:var(--ac);text-shadow:0 0 18px rgba(57,245,196,.55)}
.hb span{display:block;margin-top:8px;font:12px var(--mono);color:var(--mu)}
.hl{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:6px 0 -8px}
.labs{display:flex;flex-direction:column;gap:10px}
.lc{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:1px solid var(--ln);background:var(--pn);border-radius:18px;padding:12px 14px}
.lc:active{transform:scale(.985)}
.lc canvas{width:58px;height:58px;flex:none;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--lcl),0 0 16px var(--lcg)}
.lc div{flex:1;min-width:0}
.lc b{display:block;font-size:16px;color:var(--lcc)}
.lc span{display:block;font-size:12.5px;color:var(--mu);margin-top:2px;line-height:1.35}
.lc em{display:block;font:normal 11px var(--mono);color:var(--tx);opacity:.75;margin-top:6px}
.lc i{font-style:normal;color:var(--mu);font-size:20px;flex:none}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon div{border:1px dashed var(--ln);border-radius:12px;padding:8px 11px;font-size:12.5px;color:var(--mu)}
.soon b{display:block;color:var(--tx);font-size:13px;font-weight:600}
.chip.vw{color:var(--hi)}
.hit{position:absolute;left:0;top:0;z-index:5;pointer-events:none;background:rgba(9,13,26,.93);border:1px solid var(--ln2);border-radius:12px;padding:6px 9px;font:11px/1.45 var(--mono);color:var(--tx);box-shadow:0 0 14px rgba(57,245,196,.2);white-space:nowrap;font-variant-numeric:tabular-nums;animation:hitf 3s forwards}
.hit b{color:var(--hi);font-weight:600}.hit .t{color:var(--mu);font-size:10px}.hit .v{color:var(--ac2)}
@keyframes hitf{0%{opacity:0}6%{opacity:1}78%{opacity:1}100%{opacity:0}}
/* Gold brand layer: icon, hero, intro. Gold is the brand; teal stays the physics. */
:root{--g0:#fff6c8;--g1:#ffd23f;--g2:#ff9b2f;--g3:#b8730a}
.gold{background:linear-gradient(100deg,var(--g3) 0%,var(--g1) 28%,var(--g0) 44%,var(--g1) 60%,var(--g2) 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,190,60,.35));animation:shine 7s linear infinite}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
.hero{position:relative;margin:-28px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;height:300px;overflow:hidden;display:flex;align-items:flex-end}
.hero canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to bottom,rgba(5,6,13,0),var(--bg));pointer-events:none}
.hero-in{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px 22px;text-align:center}
.hero-in svg{width:132px;height:132px;filter:drop-shadow(0 0 22px rgba(255,170,40,.28))}
.hero-in .hb b{font-size:32px}
.hero-in .hb span{margin-top:8px}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.tw.b{animation-delay:-.9s}.tw.c{animation-delay:-1.7s}.tw.d{animation-delay:-.4s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.lc{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 120ms);position:relative;overflow:hidden}
.lc::after{content:"";position:absolute;top:0;bottom:0;width:60%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,214,90,.10),transparent);transform:skewX(-18deg);animation:sheen 1.1s ease-out both;animation-delay:calc(var(--i,0)*70ms + 450ms);pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheen{to{left:130%}}
#intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;background:radial-gradient(circle at 50% 44%,#1d1406 0%,var(--bg) 62%);display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#intro.out{opacity:0;pointer-events:none}
#intro canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#intro .in-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#intro svg{width:168px;height:168px;animation:pop 1s cubic-bezier(.2,1.4,.3,1) both;filter:drop-shadow(0 0 30px rgba(255,170,40,.4))}
#intro b{font:700 30px/1 var(--mono);letter-spacing:.24em;animation:rise .7s .45s both}
#intro span{font:13px var(--mono);color:var(--mu);letter-spacing:.06em;animation:rise .7s .7s both}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-20deg);filter:blur(6px)}to{opacity:1;transform:none}}
#gate .gicon svg{width:96px;height:96px;filter:drop-shadow(0 0 18px rgba(255,170,40,.3))}
/* guided experiments */
#xc{animation:xin .35s cubic-bezier(.2,.8,.2,1) both;transition:border-color .5s,box-shadow .5s}
@keyframes xin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#xc.won{border-color:rgba(255,210,63,.8);box-shadow:0 0 24px rgba(255,190,60,.22),0 8px 24px rgba(0,0,0,.5)}
#xc .note{margin-top:5px}
#xc .note b{color:var(--g1);font-weight:600}
.chk{gap:5px 6px;margin-top:7px}
.chk span{background:rgba(57,245,196,.06);border:1px solid transparent;border-radius:8px;padding:3px 7px}
.chk span.okp{background:rgba(57,245,196,.12);border-color:rgba(57,245,196,.3)}
.chk span.app{border-color:rgba(255,210,63,.3)}
.xs{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:7px;border-top:1px solid var(--ln)}
.st2{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font:600 12px var(--mono);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st2 i{width:7px;height:7px;border-radius:50%;background:var(--au);flex:none;animation:pulse 1.2s ease-in-out infinite}
.st2.ok{color:var(--g1);text-shadow:0 0 10px rgba(255,190,60,.4)}
@keyframes pulse{50%{opacity:.2;transform:scale(.7)}}
.nx{flex:none;border:1px solid var(--ln2);background:transparent;color:var(--ac);border-radius:10px;padding:6px 11px;font:600 12px var(--mono)}
#xc.won .nx{background:linear-gradient(100deg,#ffd23f,#fff0a8 45%,#ff9b2f);border-color:#ffd23f;color:#1a1205;box-shadow:0 0 14px rgba(255,180,50,.3)}
.xp{margin:12px 0 4px}
.xp .t{display:flex;justify-content:space-between;align-items:baseline;font:12px var(--mono);color:var(--mu);margin-bottom:6px}
.xp .t b{color:var(--g1);font-weight:600}
.bar{height:6px;border-radius:3px;background:rgba(255,210,63,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#b8730a,#ffd23f 60%,#fff0a8);box-shadow:0 0 10px rgba(255,190,60,.5);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ex{align-items:center}
.ex .nb{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;font:700 12px var(--mono);color:var(--ac);flex:none;margin:0}
.ex .nb.dn{border-color:#ffd23f;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd23f 55%,#ff9b2f);color:#1a1205;box-shadow:0 0 12px rgba(255,190,60,.45)}
.ex .gr{margin:0}
.lc .lp{display:block;height:3px;border-radius:2px;background:rgba(255,210,63,.1);margin-top:8px;overflow:hidden}
.lc .lp i{display:block;height:100%;background:linear-gradient(90deg,#b8730a,#ffd23f,#fff0a8)}
.lc em b{display:inline;font-size:inherit;color:var(--g1);font-weight:600}
/* language: Farsi runs right-to-left in Vazirmatn; numbers, units and formulas stay left-to-right islands */
html[lang=fa]{--mono:"Vazirmatn",system-ui,sans-serif;--ui:"Vazirmatn",system-ui,sans-serif}
html[lang=fa] body *{letter-spacing:0!important}
html[lang=fa] .hb b,html[lang=fa] #intro b{font-family:var(--logo)!important;letter-spacing:.22em!important}
html[lang=fa] #gcode{letter-spacing:.06em!important}html[lang=fa] #gcode::placeholder{letter-spacing:0!important}
html[dir=rtl] #bBack svg{transform:scaleX(-1)}
canvas{direction:ltr}
.chk b,.st b,.row output,.sl .h output,.hit{direction:ltr;unicode-bidi:isolate}
html[dir=rtl] .law{unicode-bidi:plaintext;text-align:right}
html[lang=fa] .note{font-size:13.5px;line-height:1.7}html[lang=fa] .chk{font-size:12.5px}html[lang=fa] .it span{font-size:11.5px;line-height:1.35}
html[lang=fa] .lc span{font-size:13px;line-height:1.6}html[lang=fa] .lc em{font-size:12px}html[lang=fa] .hl{font-size:12.5px}
html[lang=fa] #sh p{font-size:14px;line-height:1.8}html[lang=fa] #sh h2{font-weight:800;font-size:18px}html[lang=fa] .ex span{font-size:12.5px;line-height:1.6}
html[lang=fa] .row label,html[lang=fa] .sl .h{font-size:14px}html[lang=fa] .row label small{font-size:12px;line-height:1.6}html[lang=fa] #labT{font-size:17px;font-weight:800}
#langBtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:102;border:1px solid var(--ln2);background:rgba(10,15,29,.85);color:var(--tx);border-radius:999px;padding:7px 14px;font:600 13px "Vazirmatn",system-ui,sans-serif}
#langBtn[lang=en]{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* guide: a slim one-time tip, and an experiment card that can shrink to its status line */
#xc{padding:8px 11px}
#xc.hintm{padding:6px;padding-inline-start:12px}
.hintc{display:flex;align-items:center;gap:6px}

ق", "R (flat)": "R (سطح صاف)", "peak": "بیشینه", "Cells, resistors, bulbs, meters and capacitors": "باتری، مقاومت، لامپ، سنجنده و خازن", "Drag from a gold terminal to another to lay a wire. Tap a switch to flip it; tap a wire to select or delete it.": "از یک پایانهٔ طلایی تا پایانهٔ دیگر بکشید تا سیم وصل شود. برای قطع و وصل روی کلید بزنید؛ برای انتخاب یا حذف سیم، روی آن بزنید.", "Gas laws, molecules, calorimetry and conduction": "قانون‌های گاز، مولکول‌ها، گرماسنجی و رسانش", "Open an instrument’s settings to heat the gas, move the piston or change the materials.": "تنظیمات هر دستگاه را باز کنید تا گاز را گرم کنید، پیستون را جابه‌جا کنید یا جنس‌ها را عوض کنید.", "Pressure, buoyancy, Bernoulli and Torricelli": "فشار، شناوری، برنولی و توریچلی", "Drop things into the tank: light ones float, dense ones sink. Change the liquid in the tank’s settings.": "وسایل را در مخزن بیندازید: سبک‌ها شناور می‌مانند و چگال‌ها فرو می‌روند. مایع را در تنظیمات مخزن عوض کنید.", "Gravity & orbits": "گرانش و مدارها", "Satellites, Kepler’s laws and escape speed": "ماهواره، قانون‌های کپلر و تندی گریز", "Change the launch speed in the settings: too slow and it falls, just right and it circles, too fast and it escapes.": "تندی پرتاب را در تنظیمات تغییر دهید: کم باشد می‌افتد، درست باشد دور می‌زند، زیاد باشد می‌گریزد.", "Photons, atoms, nuclei and relativity": "فوتون، اتم، هسته و نسبیت", "Tap the atom’s levels, shine light on a metal, or watch nuclei decay. Each instrument has its own settings.": "روی ترازهای اتم بزنید، به فلز نور بتابانید یا واپاشی هسته‌ها را تماشا کنید. هر دستگاه تنظیمات خودش را دارد.", "AC & transformers": "جریان متناوب و مبدل", "Alternating current, induction and power lines": "جریان متناوب، القا و خطوط انتقال", "Nuclear energy": "انرژی هسته‌ای", "Fission, fusion and E = mc²": "شکافت، همجوشی و E = mc²", "Electronics": "الکترونیک", "Diodes, transistors and logic": "دیود، ترانزیستور و منطق", "Astrophysics": "اخترفیزیک", "Stars, light-years and the Big Bang": "ستاره‌ها، سال نوری و مهبانگ", "All experiments by grade": "همهٔ آزمایش‌ها بر اساس پایه", "Curriculum": "برنامهٔ درسی", "Every experiment in the app, by school year. Tap one to open it.": "همهٔ آزمایش‌های برنامه، بر اساس پایهٔ تحصیلی. برای باز کردن روی هر کدام بزنید.", "model4": "مدار با تحلیل گره‌ای حل می‌شود (G·V = I) و خازن با گام زمانی کوچک؛ گاز ایده‌آل از مولکول‌هایی ساخته شده که فشار را با برخورد به پیستون می‌سازند؛ شناوری از حجم بخش فرورفته محاسبه می‌شود؛ مدارها با G و جرم‌های واقعی انتگرال‌گیری می‌شوند و فیزیک جدید از hf، ترازهای بور، واپاشی تصادفی و هندسهٔ ساعت نوری می‌آید.", "P each, in series": "P هر لامپ در حالت متوالی", "P each, in parallel": "P هر لامپ در حالت موازی", "Ratio": "نسبت", "ρ body / ρ liquid": "ρ جسم / ρ مایع", "Fraction under": "سهم زیر سطح", "Ice": "یخ", "Cork": "چوب‌پنبه", "floats": "شناور", "sinks": "فرو می‌رود", "Height change": "تغییر ارتفاع", "Launch v": "v پرتاب", "Electrons": "الکترون‌ها", "Peak ε, magnet moving": "بیشینهٔ ε با آهنربای متحرک", "ε, magnet still": "ε با آهنربای ساکن", "Ohm's law": "قانون اهم", "A 6 V cell drives current through a 100 Ω resistor. The ammeter reads the current, the voltmeter the voltage across the resistor. Change R or ε and I follows V/R.": "یک باتری 6 V جریانی از مقاومت 100 Ω عبور می‌دهد. آمپرسنج جریان و ولت‌سنج ولتاژ دو سر مقاومت را نشان می‌دهد. R یا ε را تغییر دهید؛ I از V/R پیروی می‌کند.", "Resistors in series": "مقاومت‌های متوالی", "R = R₁ + R₂ · the same current flows through both": "R = R₁ + R₂ · از هر دو یک جریان می‌گذرد", "100 Ω and 200 Ω in series on a 9 V cell. One path, so one current: I = ε / (R₁ + R₂).": "مقاومت‌های 100 Ω و 200 Ω به‌طور متوالی به باتری 9 V وصل‌اند. یک مسیر، پس یک جریان: I = ε / (R₁ + R₂).", "Resistors in parallel": "مقاومت‌های موازی", "100 Ω and 300 Ω side by side on a 9 V cell. The current splits; the pair behaves like 75 Ω.": "مقاومت‌های 100 Ω و 300 Ω کنار هم به باتری 9 V وصل‌اند. جریان تقسیم می‌شود و این دو مثل یک مقاومت 75 Ω رفتار می‌کنند.", "Kirchhoff's junction rule": "قاعدهٔ گرهٔ کیرشهف", "All the current that flows into a junction flows out of it. Three ammeters read the main current and each branch.": "هر جریانی که وارد گره می‌شود از آن خارج می‌شود. سه آمپرسنج جریان اصلی و جریان هر شاخه را نشان می‌دهند.", "EMF and internal resistance": "نیروی محرکه و مقاومت درونی", "A 9 V cell with 2 Ω inside it feeds 10 Ω. The voltmeter across the cell reads less than 9 V: the cell loses I·r inside itself.": "باتری 9 V با مقاومت درونی 2 Ω به مقاومت 10 Ω وصل است. ولت‌سنج دو سر باتری کمتر از 9 V نشان می‌دهد؛ باتری I·r را درون خودش از دست می‌دهد.", "Bulbs in series and parallel": "لامپ‌های متوالی و موازی", "P = V²/R: each parallel bulb gets 4× the power of a series one": "P = V²/R: هر لامپ موازی ۴ برابر لامپ متوالی توان می‌گیرد", "Two identical 12 Ω bulbs on each 6 V cell. In series they share the voltage; in parallel each gets all of it, and glows much brighter.": "دو لامپ یکسان 12 Ω روی هر باتری 6 V. در حالت متوالی ولتاژ را تقسیم می‌کنند؛ در حالت موازی هر کدام تمام ولتاژ را می‌گیرد و بسیار پرنورتر است.", "Charging a capacitor": "پر شدن خازن", "The switch closes after 1 s and a 1 kΩ resistor charges 1000 µF. After one time constant τ = RC = 1 s the capacitor reaches 63.2 % of ε.": "کلید پس از 1 s بسته می‌شود و مقاومت 1 kΩ خازن 1000 µF را پر می‌کند. پس از یک ثابت زمانی τ = RC = 1 s ولتاژ خازن به 63.2% مقدار ε می‌رسد.", "Boyle's law": "قانون بویل", "P·V = n·R·T: at fixed T, P·V stays the same": "P·V = n·R·T: در دمای ثابت، P·V ثابت می‌ماند", "Molecules hit the piston and push on it; the pressure is measured from those hits. Change the piston height in its settings: P rises as V falls.": "مولکول‌ها به پیستون می‌خورند و آن را هل می‌دهند؛ فشار از همین برخوردها اندازه‌گیری می‌شود. ارتفاع پیستون را در تنظیمات تغییر دهید: با کاهش V، فشار P بالا می‌رود.", "Charles's law": "قانون شارل", "At fixed P: V / T stays the same": "در فشار ثابت: V / T ثابت می‌ماند", "The piston is free and carries a 100 kPa load. Heat the gas from 300 K to 400 K: it expands until its pressure balances the load again.": "پیستون آزاد است و بار 100 kPa دارد. گاز از 300 K تا 400 K گرم می‌شود و آن‌قدر منبسط می‌شود تا فشارش دوباره با بار برابر شود.", "Pressure law": "قانون فشار (گی‌لوساک)", "At fixed V: P / T stays the same": "در حجم ثابت: P / T ثابت می‌ماند", "The piston is fixed. Heating to 450 K makes the molecules faster, so they hit harder and more often.": "پیستون ثابت است. با گرم شدن تا 450 K مولکول‌ها تندتر می‌شوند و محکم‌تر و بیشتر برخورد می‌کنند.", "Molecular speeds": "تندی مولکول‌ها", "Mean speed (2D): v̄ = √(πkT / 2m)": "تندی میانگین (دوبعدی): v̄ = √(πkT / 2m)", "The bars count how many molecules move at each speed; the gold curve is the Maxwell–Boltzmann distribution. Speeds are shown for nitrogen.": "ستون‌ها نشان می‌دهند چند مولکول با هر تندی حرکت می‌کنند؛ منحنی طلایی توزیع ماکسول–بولتزمان است. تندی‌ها برای نیتروژن است.", "Calorimetry": "گرماسنجی", "200 g of iron at 100 °C drops into 300 g of water at 20 °C. Heat lost by the block equals heat gained by the water.": "200 g آهن با دمای 100 °C در 300 g آب با دمای 20 °C می‌افتد. گرمایی که قطعه از دست می‌دهد برابر گرمایی است که آب می‌گیرد.", "Heat conduction": "رسانش گرما", "A copper bar joins boiling water and ice. Once the temperature profile is a straight line, the heat flow through the bar is measured at the cold end.": "یک میلهٔ مسی آب جوش را به یخ وصل می‌کند. وقتی نمودار دما خط راست شد، آهنگ شارش گرما در سر سرد اندازه‌گیری می‌شود.", "Pressure in a liquid": "فشار در مایع", "The probe sits 10 cm under the surface. Drag it deeper and the pressure rises by ρ·g for every metre.": "فشارسنج 10 cm زیر سطح است. آن را عمیق‌تر ببرید؛ فشار به ازای هر متر به اندازهٔ ρ·g بالا می‌رود.", "Archimedes' principle": "اصل ارشمیدس", "A floating body sinks until it displaces its own weight: fraction under = ρ_body / ρ_liquid": "جسم شناور تا جایی فرو می‌رود که هم‌وزن خودش مایع جابه‌جا کند: سهم زیر سطح = ρ جسم / ρ مایع", "A wooden block (ρ = 600 kg/m³) is dropped into water. It settles with 60 % of it under the surface.": "یک قطعهٔ چوب (ρ = 600 kg/m³) در آب انداخته می‌شود و با 60% حجمش زیر سطح آرام می‌گیرد.", "Floating and sinking": "شناوری و فرو رفتن", "An object floats if ρ_object < ρ_liquid": "جسم شناور می‌ماند اگر ρ جسم < ρ مایع", "Ice (917 kg/m³), cork (240) and steel (7850) are dropped into water. Change the liquid to mercury and even the steel ball floats.": "یخ (917 kg/m³)، چوب‌پنبه (240) و فولاد (7850) در آب انداخته می‌شوند. مایع را جیوه کنید؛ حتی گلولهٔ فولادی هم شناور می‌شود.", "Weighing in water": "وزن کردن در آب", "Reading = m·g − ρ·V·g": "عدد ترازو = m·g − ρ·V·g", "A steel ball hangs on a 20 N/m spring with most of the spring above a tank. In water the spring stretches less: the water pushes up with ρ·V·g.": "یک گلولهٔ فولادی از فنری با ثابت 20 N/m آویزان است. در آب فنر کمتر کشیده می‌شود؛ آب با نیروی ρ·V·g آن را به بالا هل می‌دهد.", "Continuity and Bernoulli": "پیوستگی و برنولی", "Water flows at 0.5 L/s through a pipe that narrows to half its diameter. It speeds up four times, and the pressure (the height of the water columns) drops.": "آب با آهنگ 0.5 L/s از لوله‌ای می‌گذرد که قطرش نصف می‌شود. تندی آب ۴ برابر می‌شود و فشار (ارتفاع ستون‌های آب) پایین می‌آید.", "Torricelli's law": "قانون توریچلی", "Water leaves a small hole as fast as if it had fallen from the surface. Its speed is measured from where the jet lands: v = range / √(2y/g).": "آب با همان تندی از سوراخ بیرون می‌آید که اگر از سطح آب سقوط کرده بود. تندی از محل فرود فواره اندازه‌گیری می‌شود: v = range / √(2y/g).", "Sliding down an incline": "لغزش روی سطح شیبدار", "A wooden block slides down a 30° ramp with μ = 0.2. Its acceleration along the slope is measured from its speed.": "یک قطعهٔ چوب روی سطح شیبدار 30° با μ = 0.2 می‌لغزد. شتاب آن در امتداد شیب از روی تندی‌اش اندازه‌گیری می‌شود.", "Rolling down an incline": "غلتیدن روی سطح شیبدار", "Solid ball rolling: a = (5/7)·g·sin θ": "گلولهٔ توپر در حال غلتش: a = (5/7)·g·sin θ", "A steel ball rolls without slipping (μ = 0.6). Part of its energy goes into spinning, so it is slower than a sliding block on ice.": "یک گلولهٔ فولادی بدون لغزش می‌غلتد (μ = 0.6). بخشی از انرژی‌اش صرف چرخش می‌شود، پس از جسمی که روی یخ می‌لغزد کندتر است.", "Projectile motion": "حرکت پرتابی", "The launcher fires a steel ball at 1.5 m/s and 45°. With no air, the path is a parabola; the landing point is measured.": "پرتابگر یک گلولهٔ فولادی را با تندی 1.5 m/s و زاویهٔ 45° پرتاب می‌کند. بدون هوا مسیر سهمی است و محل فرود اندازه‌گیری می‌شود.", "Conservation of energy": "پایستگی انرژی", "A pendulum released from 60° turns all its height into speed at the bottom. The fastest speed of the first swing is measured.": "آونگی که از 60° رها می‌شود تمام ارتفاعش را در پایین به تندی تبدیل می‌کند. بیشترین تندی در نوسان اول اندازه‌گیری می‌شود.", "Circular orbit": "مدار دایره‌ای", "A satellite at 400 km (like the space station) launched at exactly the circular speed keeps its height, going round in about 92 minutes.": "ماهواره‌ای در ارتفاع 400 km (مثل ایستگاه فضایی) که دقیقاً با تندی مداری پرتاب شود ارتفاعش را حفظ می‌کند و در حدود ۹۲ دقیقه یک دور می‌زند.", "Kepler's third law": "قانون سوم کپلر", "Launched faster than circular, the satellite follows an ellipse. Its period depends only on the average radius a = (r_min + r_max)/2.": "اگر تندتر از تندی مداری پرتاب شود، ماهواره روی بیضی حرکت می‌کند. دورهٔ آن فقط به شعاع میانگین a = (r_min + r_max)/2 بستگی دارد.", "Escape speed": "تندی گریز", "At the escape speed the satellite never comes back: its kinetic energy is just enough to climb out of Earth’s gravity.": "با تندی گریز ماهواره هرگز برنمی‌گردد؛ انرژی جنبشی‌اش درست به اندازهٔ بیرون رفتن از گرانش زمین است.", "Standing waves on a string": "موج ایستاده در تار", "The driver sweeps from 120 Hz to 320 Hz. The string answers strongly only at its fundamental frequency, where exactly half a wavelength fits.": "نوسان‌ساز از 120 Hz تا 320 Hz جاروب می‌کند. تار فقط در بسامد اصلی‌اش، جایی که دقیقاً نیم طول موج روی آن جا می‌شود، به‌شدت پاسخ می‌دهد.", "Photoelectric effect": "اثر فوتوالکتریک", "300 nm ultraviolet light shines on sodium. The fastest electrons carry the photon energy minus the work function φ.": "نور فرابنفش 300 nm به سدیم می‌تابد. تندترین الکترون‌ها انرژی فوتون منهای تابع کار φ را دارند.", "Threshold frequency": "بسامد آستانه", "No electrons when h·f < φ, however bright the light": "وقتی h·f < φ باشد هیچ الکترونی جدا نمی‌شود، هرچقدر هم نور شدید باشد", "Bright 400 nm light on zinc frees no electrons: each photon has 3.1 eV, less than zinc’s 4.33 eV. Switch to 250 nm and they flow at once.": "نور شدید 400 nm از روی هیچ الکترونی جدا نمی‌کند؛ هر فوتون 3.1 eV دارد که کمتر از 4.33 eV روی است. طول موج را 250 nm کنید تا فوراً جریان برقرار شود.", "Hydrogen spectrum": "طیف هیدروژن", "A discharge lamp keeps exciting the atom. Each jump down to n = 2 gives a visible Balmer line: 656, 486, 434 nm …": "لامپ تخلیه پیوسته اتم را برانگیخته می‌کند. هر گذار به n = 2 یک خط مرئی بالمر می‌دهد: 656، 486، 434 nm …", "Radioactive half-life": "نیمه‌عمر پرتوزا", "1024 iodine-131 nuclei decay at random. However random each one is, half of them are gone after one half-life (8.02 days, sped up).": "1024 هستهٔ ید-131 به‌طور تصادفی واپاشیده می‌شوند. با وجود تصادفی بودن هر کدام، پس از یک نیمه‌عمر (8.02 روز، تندشده) نیمی از آن‌ها از بین رفته‌اند.", "Time dilation": "اتساع زمان", "Both clocks bounce light between two mirrors. Seen from here, the light in the moving clock runs a longer, slanted path, so its ticks come γ times slower.": "هر دو ساعت نور را بین دو آینه رفت‌وبرگشت می‌دهند. از دید ما نور در ساعت متحرک مسیر مورب و بلندتری می‌پیماید، پس تیک‌هایش γ برابر کندتر است.", "Faraday's law of induction": "قانون القای فارادی", "A magnet moves in and out of a 200-turn coil for 6 s, then stops. A changing flux drives the needle; a still magnet, however strong, gives nothing.": "آهنربا ۶ ثانیه درون سیم‌پیچ ۲۰۰ دوری جلو و عقب می‌رود و سپس می‌ایستد. شار متغیر عقربه را تکان می‌دهد؛ آهنربای ساکن، هرچقدر قوی، چیزی القا نمی‌کند.", "V = ε(1 − e^(−t/RC)) · τ = RC": "V = ε(1 − e^(−t/RC)) · τ = RC"},EN={"model1": "Magnets use the magnetic-pole model: each pole face carries q = Br·A/μ₀, so a pole gives 1/r² and a whole magnet gives the 1/r³ dipole field far away. Iron and steel magnetise in the local field (m = χ·V·B/μ₀, capped at saturation), which is why they always attract. Wires carry current out of or into the screen: B = μ₀I/2πr.", "model2": "Charges follow Coulomb's law; plates give a uniform E = V/d. Electrons, protons and alpha particles move with F = q(E + v×B) on their own slow-motion clock, so nanosecond paths become visible. Bodies collide with impulses and, in table view, feel static and sliding friction. Everything is 2D: forces that would point out of the screen are not shown.", "model3": "Light travels as rays: mirrors reflect, glass refracts by Snell's law with an index that depends on colour, and thin lenses bend each ray by the height where it lands. Sound is a pressure wave at 343 m/s, slowed about 4,300× so you can watch it; waves from several speakers add up, so they can also cancel.", "egg-spark": "Easter egg: you found Einstein's spark!", "egg-owl": "Easter egg: night-owl physicist!", "egg-crowd": "Easter egg: crowded lab, 15 things on the table!", "egg-bounce": "Easter egg: 25 impacts, Newton would be proud!", "con-first": "Congratulations! Your first verified experiment", "con-lab": "Congratulations! You verified every {$l} experiment", "con-all": "Congratulations! Every experiment done: grand physicist!", "con-regular": "Congratulations! Your third visit", "model4": "Circuits are solved by nodal analysis (G·V = I), capacitors step by step in time; the ideal gas is made of molecules whose hits on the piston give the pressure; buoyancy comes from the submerged volume; orbits are integrated with the real G and masses; modern physics follows hf, the Bohr levels, random decay and the geometry of a light clock."};

function tdef(k){var t=TP[k];if(t.alias){var b=TP[t.alias],o={};for(var q in b)o[q]=b[q];for(q in t)if(q!=='alias'&&q!=='p')o[q]=t[q];o.p={};for(q in b.p)o.p[q]=b.p[q];if(t.p)for(q in t.p)o.p[q]=t.p[q];o.k=k;o.base=t.alias;return o;}return t;}

/* ================= geometry builders ================= */
function rectCol(b,w,h){
  var mn=Math.min(w,h),mx=Math.max(w,h),r=mn/2;if(mx/mn<1.6)r=mn/4;
  var nx=Math.max(1,Math.round(w/(2*r))),ny=Math.max(1,Math.round(h/(2*r))),c=[];
  for(var i=0;i<nx;i++)for(var j=0;j<ny;j++){c.push([nx===1?0:-w/2+r+i*(w-2*r)/(nx-1),ny===1?0:-h/2+r+j*(h-2*r)/(ny-1),r]);}
  b.col=c;
}
function finish(b){var br=0;for(var i=0;i<b.col.length;i++){var c=b.col[i];br=Math.max(br,hyp(c[0],c[1])+c[2]);}b.br=br;}
// demagnetising factor of a rod with aspect a (long/thick) → effective susceptibility 1/Nd
// pole placed δ inside its face: field at the face = K·q/ε² (same as a uniformly charged face), no singularity outside the body
function pole(x,y,q,ox,oy,A,len){var e=Math.sqrt(A/(2*Math.PI)),d=Math.min(e,0.35*len);return [x-ox*d,y-oy*d,q,ox,oy,Math.max(e*e-d*d,0.0625*d*d),d];}
function chiRod(a){if(a<1.6)return 3;var s=Math.sqrt(a*a-1);var nd=(a/s*Math.log(a+s)-1)/(a*a-1);return Math.min(1/nd,1500);}

function geo(b){
  var t=b.T,p=b.p,g=t.geo;b.pl=[];b.hw=0;b.hh=0;
  if(g==='rect'){
    var w=p.w,h=p.h,dz=p.cyl?h:(p.dz||h);
    b.hw=w/2;b.hh=h/2;rectCol(b,w,h);
    b.vol=p.wire?Math.PI*p.wire*p.wire/4*w*2.6:(p.cyl?Math.PI*h*h/4*w:w*h*dz);
    b.m=p.mass||t.rho*b.vol;b.I=b.m*(w*w+h*h)/12;
    var A=p.cyl?Math.PI*h*h/4:h*dz;b.face=A;
    if(t.mag==='perm'){var q=p.Br*A/MU0;b.pl=[pole(w/2,0,q,1,0,A,w),pole(-w/2,0,-q,-1,0,A,w)];b.mom=q*(w-2*b.pl[0][6]);}
    if(t.mag==='coil'){var Ac=h*h*0.8,gain=p.core?chiRod(w/h)+1:1;var m=p.N*p.I*Ac*gain;var msat=1.7e6*w*h*h*0.5+p.N*Math.abs(p.I)*Ac;if(Math.abs(m)>msat)m=sgn(m)*msat;var dc=Math.min(Math.sqrt(Ac/(2*Math.PI)),0.35*w),qc=m/(w-2*dc);b.pl=[pole(w/2,0,qc,1,0,Ac,w),pole(-w/2,0,-qc,-1,0,Ac,w)];b.mom=m;b.gain=gain;}
    if(t.soft){var thick=p.wire||h;b.chi=chiRod(w/thick);b.rod=w/thick>=1.6;b.sface=p.wire?Math.PI*p.wire*p.wire/4:A;}
  }else if(g==='ball'){
    var r=p.r;b.hw=b.hh=r;b.col=[[0,0,r]];b.vol=4/3*Math.PI*r*r*r;
    b.m=p.mass||(t.rho?t.rho*b.vol:0.01);b.I=0.4*b.m*r*r;
    if(t.mag==='perm'){var mm=p.Br*b.vol/MU0,d=0.2*r,qq=mm/(2*d);b.pl=[[d,0,qq,1,0,Math.pow(0.15*r,2),0.5*r],[-d,0,-qq,-1,0,Math.pow(0.15*r,2),0.5*r]];b.mom=mm;}
    if(t.soft){b.chi=3;b.rod=false;b.sface=Math.PI*r*r;}
  }else if(g==='U'){
    var W2=p.w/2,H=p.h,tt=p.t,c=[],n,k;
    b.hw=W2;b.hh=H/2;
    // two arms (x=±(W2-t/2)) from y=-H/2+t/2 to +H/2 - t/2, plus base
    var ax=W2-tt/2,r2=tt/2;n=Math.max(2,Math.round((H-tt)/tt));
    for(k=0;k<=n;k++){var yy=-H/2+r2+k*(H-tt)/n;c.push([-ax,yy,r2]);c.push([ax,yy,r2]);}
    n=Math.max(1,Math.round(2*ax/tt));for(k=1;k<n;k++)c.push([-ax+k*2*ax/n,-H/2+r2,r2]);
    b.col=c;b.vol=(2*H+2*ax)*tt*tt;b.m=t.rho*b.vol;
    var Ii=0;for(k=0;k<c.length;k++)Ii+=c[k][0]*c[k][0]+c[k][1]*c[k][1]+c[k][2]*c[k][2]/2;b.I=b.m*Ii/c.length;
    var Af=tt*tt,qu=p.Br*Af/MU0;b.face=Af;
    b.pl=[pole(-ax,H/2,qu,0,1,Af,H),pole(ax,H/2,-qu,0,1,Af,H)];b.mom=qu*2*ax;
  }else if(g==='comp'){
    var rc=p.r,ln=rc*0.82;b.hw=b.hh=rc;b.col=[[0,0,rc]];b.m=0.004;b.I=2e-4*ln*ln*4/12;
    var qn=p.m/(ln*1.6);b.pl=[[ln*0.8,0,qn,1,0,1e-6,0.002],[-ln*0.8,0,-qn,-1,0,1e-6,0.002]];b.mom=p.m;
  }else if(g==='plates'){
    var L=p.w,dd=p.d,cc=[],rp=0.0025,np=Math.round(L/(2*rp));
    for(var i=0;i<np;i++){var xx=-L/2+rp+i*(L-2*rp)/(np-1);cc.push([xx,dd/2+rp,rp]);cc.push([xx,-dd/2-rp,rp]);}
    b.col=cc;b.hw=L/2;b.hh=dd/2+2*rp;b.m=1;b.I=1;
  }else if(g==='zone'){b.col=[];b.hw=p.w/2;b.hh=p.h/2;b.m=1;b.I=1;}

/* ================= integration + contacts ================= */
var NSUB=10,WMAX=0,HS=1/600;

  lists();
  for(var s=0;s<NSUB;s++){
    induce(0.6);lists();induce(0.6);lists();forces();
    for(i=0;i<BD.length;i++){b=BD[i];b.hit0=b.hit;
      if(b.drag){b.x+=b.vx*h;b.y+=b.vy*h;if(b.T.jt==='rod')rodFix(b);continue;}
      if(b.pin||b.ghost){b.vx=b.vy=0;if(b.T.piv||b.T.geo==='comp'){}else{b.om=0;continue;}}
      if(b.T.piv){b.om+=b.tq/b.I*h;var wc=Math.sqrt(Math.abs(b.tq)/b.I);if(wc>WMAX)WMAX=wc;b.om*=Math.exp(-4*h);b.a+=b.om*h;b.vx=b.vy=0;continue;}

      if(S.mode==='table'&&S.mu>0){
        var dec=S.mu*S.g*h,sp=hyp(b.vx,b.vy),Fm=hyp(b.fx,b.fy);
        if(sp<=dec*1.05&&Fm<S.mu*1.15*b.m*S.g){b.vx=b.vy=0;}else if(sp>0){var k=Math.max(0,sp-dec)/sp;b.vx*=k;b.vy*=k;}

    var n=Math.min(40,Math.ceil(vmax*dt/0.002)),h=dt/n,Pext=p.pext*1000/gasC(b)*b.gw,Mp=60;

#gate input{font:600 16px var(--mono);letter-spacing:.08em;text-align:center;color:var(--tx);background:var(--pn);border:1px solid var(--ln2);border-radius:12px;padding:12px 14px;outline:none}
#gate input:focus{border-color:var(--ac);box-shadow:0 0 12px rgba(57,245,196,.3)}
#gate .btn.f{background:linear-gradient(100deg,#ffd23f,#fff0a8 45%,#ff9b2f);border-color:#ffd23f;color:#1a1205;box-shadow:0 0 18px rgba(255,180,50,.25)}
#gate button[disabled]{opacity:.5}
#gate .msg{min-height:1.4em;font:12.5px/1.45 var(--mono);color:var(--mu);max-width:320px}
#gate .msg.bad{color:var(--bad)}
#gpill{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;font:11px var(--mono);color:var(--mu);background:var(--pn);border:1px solid var(--ln);border-radius:999px;padding:5px 10px;pointer-events:none}
.brand .gleft{color:var(--au)}
</style>
<div id="gate" class="gut">
  <div class="gicon"></div><div class="hb"><b class="gold">EINSTELAB</b><span id="gsub"></span></div>
  <form id="gform" autocomplete="off">
    <input id="gcode" type="text" autocapitalize="characters" spellcheck="false">
    <button class="btn f" type="submit" id="gbtn" disabled></button>
  </form>
  <div class="msg" id="gmsg"></div>
  <div id="gact"></div>
</div>
<div id="gpill" hidden></div>
<script>
(function(){
'use strict';
var LIFE=3*864e5,FINAL=Date.UTC(2026,11,31,23,59,59);
// SHA-256 (first 32 hex) of each valid key, uppercased with only A-Z and 0-9 kept
var KEYS=["99653fd816691d94b05a21d962aad762", "ffa365f7683eb69b579713110193798f", "89f448168754596c9ddf1aded5230d13", "1b8c6469e1f1051447e8bce241833bc5", "ade8e4a339c4fbb1d6fff696debd3fda", "6e12464d0b2c7251eace90930a3cbaaf", "a68192cd5cec9d0aa1487026faeac43e", "424e0fecaae5c525282941096b9136e8", "f6622336d6c6d773ccd65078380493b9", "9ff485e07366e487e581ebdaf22ba2e9", "572ea1919aa279004e252dbc252e86a7", "37f7c53dec5be3cca67a58db074209dd", "0cccf718a0cd4bfb18d88ce5bc4b0eba", "da494216b083a4cc30a3dd48cc196888"];
var $=function(s){return document.querySelector(s);};
// claude.ai: keys are claimed on the server per account. Elsewhere (the APK, a downloaded file): claimed on this device.
var db=null,uid=null,off=0,seen=0,end=null,owner=false,ready=false,local=false,last=['Connecting…',false];
function msg(k,bad){last=[k,bad];var el=$('#gmsg');el.textContent=k?T(k):'';el.className='msg'+(bad?' bad':'');var ga=$('#gact');if(ga)ga.innerHTML=(/ended|expired/.test(k||'')&&window.__actHTML)?window.__actHTML():'';}
function texts(){$('#gsub').textContent=T('Demo preview · 3-day access');$('#gcode').placeholder=T('Access key');$('#gcode').setAttribute('aria-label',T('Access key'));$('#gbtn').textContent=T('Unlock');msg(last[0],last[1]);tick();}
window.__gateLang=texts;
function norm(k){return k.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');}
function shaJS(m){var K=[],H=[],i,j,p=2,c=0;for(;c<64;p++){for(j=2;j*j<=p;j++)if(p%j===0)break;if(j*j>p){if(c<8)H[c]=(Math.pow(p,1/2)*4294967296)|0;K[c++]=(Math.pow(p,1/3)*4294967296)|0;}}
  var l=m.length,arr=new Uint8Array(((l+9+63)>>6)<<6),w=[];arr.set(m);arr[l]=0x80;var dv=new DataView(arr.buffer);dv.setUint32(arr.length-4,(l*8)>>>0);dv.setUint32(arr.length-8,Math.floor(l*8/4294967296));
  for(i=0;i<arr.length;i+=64){var a=H.slice(0);for(j=0;j<64;j++){if(j<16)w[j]=dv.getUint32(i+j*4);else{var x=w[j-15],y=w[j-2];w[j]=(((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+w[j-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10))+w[j-16])|0;}
    var e=a[4],t1=a[7]+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&a[5])^(~e&a[6]))+K[j]+w[j],z=a[0],t2=((z>>>2|z<<30)^(z>>>13|z<<19)^(z>>>22|z<<10))+((z&a[1])^(z&a[2])^(a[1]&a[2]));a.pop();a.unshift((t1+t2)|0);a[4]=(a[4]+t1)|0;}
    for(j=0;j<8;j++)H[j]=(H[j]+a[j])|0;}
  var o='';for(j=0;j<8;j++)o+=('00000000'+(H[j]>>>0).toString(16)).slice(-8);return o;}
function sha(k){var b=new TextEncoder().encode(k);var hex=function(h){return Array.prototype.map.call(new Uint8Array(h),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');};
  var p=(window.crypto&&crypto.subtle&&window.isSecureContext)?crypto.subtle.digest('SHA-256',b).then(hex,function(){return shaJS(b);}):Promise.resolve(shaJS(b));return p.then(function(h){return h.slice(0,32);});}
var LS='einstelab-keys',API='https://einstelab-keys.mirzahosseinimoqaddam.workers.dev';
// a stable id for this phone: from the app (survives reinstall), else one kept in this browser
function devId(){try{if(window.EinsteNative&&EinsteNative.deviceId)return 'a-'+EinsteNative.deviceId();}catch(e){}if(window.__deviceId)return 'i-'+window.__deviceId;
  var v=null;try{v=localStorage.getItem('el-dev');if(!v){v='w-'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('el-dev',v);}}catch(e){v='w-tmp';}return v;}
function api(path,body){body.device=devId();return fetch(API+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){if(j&&j.now)off=j.now-Date.now();return j;});}
function remoteAnswer(j){var v=lget();if(j.ok){v.end=j.end;lput(v);openUntil(j.end-LIFE);return;}
  if(j.reason==='expired'||j.reason==='over'){v.end=0;lput(v);end=null;lock(j.reason==='over'?'The demo period has ended.':'This key has expired. Ask for a new one.');return;}
  msg(j.reason==='used'?'This key has already been used.':j.reason==='invalid'?'That key is not valid.':'Enter the key you were given. It opens the app for 3 days.',j.reason!=='none');}
function lget(){try{var v=JSON.parse(localStorage.getItem(LS)||'null');if(v&&v.used)return v;}catch(e){}return {used:{},seen:0};}
function lput(v){try{localStorage.setItem(LS,JSON.stringify(v));}catch(e){}}
// time only moves forward: winding the phone clock back does not buy more days
function now(){var t=Date.now()+off;if(local){var v=lget();if(v.seen>t)t=v.seen;else if(t-v.seen>6e4){v.seen=t;lput(v);}}if(t>seen)seen=t;return seen;}
function serverTime(){if(local||!db||!uid)return Promise.resolve();var t0=Date.now();
  return db.doc('data/users/'+uid+'/clock').acquire({holder:uid,ttlMs:1000}).then(function(r){if(r&&r.expiresAt){var st=Date.parse(r.expiresAt)-1000;if(isFinite(st))off=st-(t0+Date.now())/2;}},function(){});}
function left(ms){var m=Math.max(1,Math.ceil(ms/6e4)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60,o=[];if(d)o.push(T('{n} d',{n:d}));if(d||h)o.push(T('{n} h',{n:h}));o.push(T('{n} min',{n:mi}));return o.join(' ');}
function reveal(){var g=$('#gate');if(!g.hidden){g.hidden=true;if(window.__intro)window.__intro();}}
function lock(k){end=null;$('#gate').hidden=false;$('#gpill').hidden=true;$('#gleft').textContent='';var lab=$('#lab');if(lab&&!lab.hidden){var bb=$('#bBack');if(bb)bb.click();}if(k)msg(k,true);}
function tick(){
  if(owner){reveal();$('#gpill').hidden=!$('#lab').hidden;$('#gpill').textContent=T('Owner preview · no key needed');return;}
  if(!end)return;var t=now();
  if(t>=end){lock(t>=FINAL?'The demo period has ended.':'Your 3-day demo has ended. Enter a new key to continue.');return;}
  reveal();var txt=T('Demo · {$t} left',{$t:left(end-t)});$('#gleft').textContent=txt;var p=$('#gpill');p.textContent=txt;p.hidden=!$('#lab').hidden;}
function openUntil(u){end=Math.min(u+LIFE,FINAL);tick();}
function restoreLocal(){var v=lget(),t=now(),best=0;for(var k in v.used)if(v.used[k]>best)best=v.used[k];
  if(best&&Math.min(best+LIFE,FINAL)>t)openUntil(best);else msg(best?'Your 3-day demo has ended. Enter a new key to continue.':'Enter the key you were given. It opens the app for 3 days.',!!best);}
function restore(){return db.collection('keys').where('by','==',uid).get().then(function(q){var t=now(),best=0;q.docs.forEach(function(d){var u=d.data().usedAt;if(typeof u==='number'&&u>best)best=u;});
  if(best&&Math.min(best+LIFE,FINAL)>t){openUntil(best);return;}msg(best?'Your 3-day demo has ended. Enter a new key to continue.':'Enter the key you were given. It opens the app for 3 days.',!!best);});}
function done(u){$('#gcode').value='';msg('');openUntil(u);}
function redeem(raw){var k=norm(raw);if(!k){msg('Enter a key.',true);return Promise.resolve();}
  return sha(k).then(function(id){if(KEYS.indexOf(id)<0){msg('That key is not valid.',true);return;}
    if(local){return api('/redeem',{key:k}).then(remoteAnswer,function(){msg(navigator.onLine===false?'Connect to the internet to enter your key.':'Could not reach the key server. Check your connection and try again.',true);});
      var v=lget(),t=now();if(t>=FINAL){msg('The demo period has ended.',true);return;}
      if(v.used[id]!==undefined){if(Math.min(v.used[id]+LIFE,FINAL)<=t)msg('This key has expired. Ask for a new one.',true);else done(v.used[id]);return;}
      v.used[id]=t;lput(v);done(t);return;}
    return serverTime().then(function(){var t=now();if(t>=FINAL){msg('The demo period has ended.',true);return;}var ref=db.doc('keys/'+id);
      return ref.acquire({holder:uid,ttlMs:5000}).then(function(l){if(!l.acquired){msg('Someone is using this key right now. Try again in a moment.',true);return;}
        return ref.get().then(function(s){if(s.exists){var d=s.data();if(d.by!==uid){msg('This key has already been used.',true);return;}
          if(Math.min(d.usedAt+LIFE,FINAL)<=t){msg('This key has expired. Ask for a new one.',true);return;}done(d.usedAt);return;}
          return ref.set({usedAt:t,by:uid}).then(function(){done(t);});});});});
  }).catch(function(e){var c=e&&e.code;msg(c==='invalid_argument'?'Your access to this page cannot save keys. Ask the owner to invite you as an editor.':c==='quota_exceeded'?'The demo cannot store more keys.':'Could not reach the server. Check your connection and try again.',true);});}
$('#gform').onsubmit=function(e){e.preventDefault();if(!ready)return;var bt=$('#gbtn');bt.disabled=true;redeem($('#gcode').value).then(function(){bt.disabled=false;});};
function boot(){
  if(!window.claude||!window.claude.use){local=true;ready=true;$('#gbtn').disabled=false;if(now()>=FINAL){msg('The demo period has ended.',true);return;}var cv0=lget();if(cv0.end&&cv0.end>Date.now())openUntil(cv0.end-LIFE);else msg('Enter the key you were given. It opens the app for 3 days.',false);api('/status',{}).then(remoteAnswer,function(){});return;}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){db=r[0];var user=r[1];if(!db||!user){msg('Sign in to Claude to use this demo.',true);return;}
    return Promise.all([user.id(),user.isOwner()]).then(function(v){uid=v[0];owner=!!v[1];if(owner){tick();return;}if(!uid){msg('Sign in to Claude to use this demo.',true);return;}
      return serverTime().then(function(){if(now()>=FINAL){msg('The demo period has ended.',true);return;}ready=true;$('#gbtn').disabled=false;return restore();});});
  }).catch(function(){msg('Could not reach the server. Reload to try again.',true);});}
try{var gi=document.querySelector('#gate .gicon');if(gi&&window.__icon)gi.innerHTML=window.__icon();}catch(e){}
texts();boot();
setInterval(tick,10000);setInterval(serverTime,10*6e4);
try{new MutationObserver(function(){tick();}).observe($('#lab'),{attributes:true,attributeFilter:['hidden']});}catch(e){}
})();
</script>

</body></html>
