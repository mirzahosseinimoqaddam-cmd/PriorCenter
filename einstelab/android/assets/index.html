:"کیفیت","Lite drops glow and halves field detail":"حالت سبک درخشش را حذف و جزئیات میدان را نصف می‌کند",Auto:"خودکار",Lite:"سبک",High:"بالا","Reset view":"بازنشانی نما","Restart this lab":"شروع دوباره","Clear the table":"پاک کردن میز","How the model works":"مدل چگونه کار می‌کند",model1:"آهنرباها با مدل قطب مغناطیسی شبیه‌سازی می‌شوند: هر سطح قطب «بار مغناطیسی» q = Br·A/μ₀ دارد؛ پس هر قطب میدانی متناسب با 1/r² می‌سازد و کل آهنربا در فاصلهٔ دور، میدان دوقطبی 1/r³ دارد. آهن و فولاد در میدان محلی مغناطیده می‌شوند (m = χ·V·B/μ₀ تا حد اشباع)؛ به همین دلیل همیشه جذب می‌شوند. جریان سیم‌ها رو به بیرون یا درون صفحه است: B = μ₀I/2πr.",model2:"بارها از قانون کولن پیروی می‌کنند و صفحه‌های موازی میدان یکنواخت E = V/d می‌سازند. الکترون، پروتون و ذرهٔ آلفا با F = q(E + v×B) و با ساعتِ آهسته‌شدهٔ خودشان حرکت می‌کنند تا مسیرهای نانوثانیه‌ای دیده شوند. اجسام با ضربه برخورد می‌کنند و در نمای میز، اصطکاک ایستایی و جنبشی دارند. همه‌چیز دوبعدی است: نیروهایی که عمود بر صفحه‌اند نمایش داده نمی‌شوند.",model3:"نور به‌صورت پرتو حرکت می‌کند: آینه‌ها بازمی‌تابانند، شیشه طبق قانون اسنل و با ضریبی وابسته به رنگ می‌شکند و عدسی نازک هر پرتو را متناسب با ارتفاع برخوردش خم می‌کند. صوت موج فشاری با تندی 343 m/s است که حدود 4300 برابر آهسته شده تا دیده شود؛ موج‌های چند بلندگو با هم جمع می‌شوند و می‌توانند یکدیگر را خنثی کنند.","Table · top view":"میز · نمای بالا","Side · g = {$g} m/s²":"کناری · g = {$g} m/s²"," · Earth B":" · میدان زمین"," · paused":" · متوقف",Pause:"توقف",Play:"پخش","All labs":"همهٔ آزمایشگاه‌ها",Experiments:"آزمایش‌ها",Close:"بستن","Show what to do":"راهنما",Minimise:"کوچک کردن","Restart this experiment":"شروع دوبارهٔ آزمایش","Next experiment":"آزمایش بعدی",Next:"بعدی","All experiments":"همهٔ آزمایش‌ها","Try it":"امتحان کنید",Verified:"تأییدشده","Not yet verified":"هنوز تأیید نشده","Something went wrong.":"مشکلی پیش آمد.","Reload the lab":"بارگذاری دوباره",Formula:"فرمول",Model:"شبیه‌سازی","measuring…":"در حال اندازه‌گیری…","✓ Explored":"✓ کاوش شد","Measuring…":"در حال اندازه‌گیری…","Not matching yet · keep watching":"هنوز منطبق نیست · صبر کنید","Checking…":"در حال بررسی…","Explore · move things around":"کاوش کنید · وسایل را جابه‌جا کنید","Each experiment sets up the table and checks the simulation against the textbook formula, live.":"هر آزمایش میز را آماده می‌کند و شبیه‌سازی را به‌صورت زنده با فرمول کتاب درسی مقایسه می‌کند.","Your progress":"پیشرفت شما","{n} of {m} verified":"{n} از {m} تأییدشده","All {n} verified ✓":"هر {n} آزمایش تأیید شد ✓","Grade 10":"پایهٔ دهم","Grade 11":"پایهٔ یازدهم","Grade 12":"پایهٔ دوازدهم",University:"دانشگاه",G10:"دهم",G11:"یازدهم",G12:"دوازدهم",UNI:"دانشگاه",Uni:"دانشگاه","Like and unlike poles":"قطب‌های همنام و ناهمنام","N–N repel · N–S attract":"N–N دفع · N–S جذب","Two pairs of NdFeB bars on the table, read at release. The repelling pair often twists round and snaps together the other way, just as real magnets do.":"دو جفت آهنربای میله‌ای نئودیمیم روی میز؛ نتیجه در لحظهٔ رها شدن خوانده می‌شود. جفتِ دافع معمولاً می‌چرخد و از سوی دیگر به هم می‌چسبد، درست مثل آهنرباهای واقعی.","Top pair (N→←N)":"جفت بالا (N→←N)","Bottom pair (N→←S)":"جفت پایین (N→←S)",repel:"دفع",attract:"جذب","Field of a bar magnet":"میدان آهنربای میله‌ای","Far on the axis: B = μ₀·2m / 4πr³ (m = pole strength × magnetic length)":"روی محور و دور از آهنربا: B = μ₀·2m / 4πr³","Compasses trace the field. The probe sits on the axis 10 cm from the centre. Close in, the real magnet is stronger than the ideal dipole formula; drag the probe further out and the two values converge.":"قطب‌نماها شکل میدان را نشان می‌دهند. میدان‌سنج روی محور و 10 cm دورتر از مرکز است؛ m قدرت قطب ضرب در طول مغناطیسی است. نزدیکِ آهنربا، آهنربای واقعی از فرمول دوقطبی ایده‌آل قوی‌تر است؛ میدان‌سنج را دورتر ببرید تا دو مقدار به هم نزدیک شوند.","Dipole formula":"فرمول دوقطبی","Model at the probe":"شبیه‌سازی در محل میدان‌سنج","Horseshoe magnet":"آهنربای نعلی","Between the poles the field is nearly uniform":"میان دو قطب، میدان تقریباً یکنواخت است","The probe sits in the gap. Filings line up straight across between the tips and curve outside.":"میدان‌سنج در فاصلهٔ میان دو قطب است. براده‌ها میان دو سرِ آهنربا صاف ردیف می‌شوند و بیرون از آن خم می‌شوند.","B in the gap":"B میان قطب‌ها",direction:"جهت","Oersted: field of a wire":"اورستد: میدان سیم حامل جریان","100 A flows out of the screen. Compasses turn tangent to circles around the wire; the probe is 2 cm away.":"جریان 100 A از صفحه بیرون می‌آید. قطب‌نماها مماس بر دایره‌هایی به دور سیم می‌چرخند؛ میدان‌سنج 2 cm از سیم فاصله دارد.","Two parallel currents":"دو جریان موازی","Same direction attracts, opposite repels. Both wires are pinned so you can read the force; unpin one and lower friction to see it move.":"جریان‌های هم‌جهت یکدیگر را جذب و جریان‌های ناهم‌جهت دفع می‌کنند. هر دو سیم ثابت شده‌اند تا نیرو را بخوانید؛ یکی را آزاد و اصطکاک را کم کنید تا حرکتش را ببینید.","m = N·I·A × core gain":"m = N·I·A × بهرهٔ هسته","Raise the current to pick up the paperclips; reverse it and the N and S ends swap. Iron is attracted either way.":"جریان را زیاد کنید تا گیره‌ها را بردارد؛ جهتش را برعکس کنید تا سرهای N و S جابه‌جا شوند. آهن در هر دو حالت جذب می‌شود.","core gain":"بهرهٔ هسته","Induced magnetism":"مغناطش القایی","Iron facing N becomes S at that end":"سرِ آهنی که رو به N است، S می‌شود","The nails become temporary magnets and pull on each other in a chain. The coloured dots show the induced poles.":"میخ‌ها آهنربای موقت می‌شوند و زنجیروار یکدیگر را می‌کشند. نقطه‌های رنگی قطب‌های القایی را نشان می‌دهند.","Nail end facing N":"سرِ میخِ رو به N","S (induced)":"S (القایی)","Coulomb's law":"قانون کولن","Two fixed +1 µC spheres 10 cm apart. Drag one to change r and watch the force follow 1/r².":"دو کرهٔ ثابت با بار +1 µC به فاصلهٔ 10 cm. یکی را بکشید تا r تغییر کند و ببینید نیرو از رابطهٔ 1/r² پیروی می‌کند.","Electric dipole":"دوقطبی الکتریکی","V = 0 on the mid-line of ±q":"روی عمودمنصفِ دو بار: V = 0","Field lines leave + and end on −. The probe on the perpendicular bisector reads zero potential.":"خطوط میدان از بار مثبت خارج می‌شوند و روی بار منفی پایان می‌یابند. میدان‌سنجِ روی عمودمنصف، پتانسیل صفر را نشان می‌دهد.","Predicted V":"V پیش‌بینی","Model V":"V شبیه‌سازی","Charging by contact":"باردار کردن با تماس","Touching spheres share charge: q ∝ R":"کره‌های در تماس بار را تقسیم می‌کنند: q ∝ R","A +20 nC pith ball is pulled toward a fixed −0.2 µC metal sphere. When they touch, the charge is shared, both end up negative, and the ball is pushed away.":"گوی سبکی با بار +20 nC به سوی کرهٔ فلزی ثابتی با بار −0.2 µC کشیده می‌شود. با تماس، بار تقسیم می‌شود، هر دو منفی می‌شوند و گوی رانده می‌شود.","Ball charge":"بار گوی","Force on ball":"نیروی وارد بر گوی",away:"دورکننده",toward:"به سوی کره","Electron in a magnetic field":"الکترون در میدان مغناطیسی","Electrons at 10⁶ m/s enter a uniform 0.1 mT field pointing out of the screen and move on a circle. The radius is measured from the drawn path.":"الکترون‌ها با تندی 10⁶ m/s وارد میدان یکنواخت 0.1 mT (رو به بیرون صفحه) می‌شوند و روی دایره حرکت می‌کنند. شعاع از روی مسیر رسم‌شده اندازه‌گیری می‌شود.","Electron deflection (CRT)":"انحراف الکترون (لامپ پرتو کاتدی)","Electrons pass 12 cm of plates with E = V/d. The vertical shift at the plate exit is compared with the formula.":"الکترون‌ها از میان صفحه‌هایی به طول 12 cm با میدان E = V/d می‌گذرند. جابه‌جایی عمودی در خروج از صفحه‌ها با فرمول مقایسه می‌شود.","Velocity selector":"سرعت‌گزین","Straight through when v = E / B":"اگر v = E / B باشد، ذره مستقیم می‌گذرد","Crossed fields: E = 100 V/m and B = 0.1 mT (into the screen). Only particles with v = E/B = 10⁶ m/s fly straight. Change the gun speed to see the others bend away.":"میدان‌های عمود بر هم: E = 100 V/m و B = 0.1 mT (رو به درون صفحه). فقط ذره‌هایی با v = E/B = 10⁶ m/s مستقیم می‌روند. تندی تفنگ را تغییر دهید تا خم شدن بقیه را ببینید.","gun v":"v تفنگ","exit shift":"جابه‌جایی خروج","Free fall":"سقوط آزاد","Side view, no air. The ball drops from rest; its speed at the moment it touches the floor is measured.":"نمای کناری، بدون هوا. توپ از حال سکون رها می‌شود و تندی آن در لحظهٔ رسیدن به کف اندازه‌گیری می‌شود.","Simple pendulum":"آونگ ساده","L = 20 cm, released from 10°. The period is timed from swing to swing.":"طول آونگ L = 20 cm است و از زاویهٔ 10° رها می‌شود. دوره از یک نوسان تا نوسان بعد زمان‌گیری می‌شود.","k = 20 N/m, m = 100 g, pulled 3 cm below equilibrium. Gravity only shifts the centre of the motion, not the period.":"k = 20 N/m و m = 100 g؛ وزنه 3 cm پایین‌تر از نقطهٔ تعادل کشیده شده. گرانش فقط مرکز نوسان را جابه‌جا می‌کند، نه دوره را.","Momentum in a collision":"تکانه در برخورد","Σp before = Σp after":"Σp پیش از برخورد = Σp پس از برخورد","Air table (μ = 0). A 57 g steel ball hits a 16 g rubber ball off-centre. Total momentum along x is measured until a ball reaches a wall.":"میز هوا (μ = 0). گلولهٔ فولادی 57 g به‌طور نامرکزی به توپ لاستیکی 16 g می‌خورد. تکانهٔ کل در راستای x تا رسیدن یکی از توپ‌ها به دیوار اندازه‌گیری می‌شود.","after impact":"پس از برخورد",yes:"بله","not yet":"هنوز نه","Law of reflection":"قانون بازتاب","A laser hits a plane mirror. Turn the mirror or the laser with its round handle: the two angles stay equal.":"باریکهٔ لیزر به آینهٔ تخت می‌تابد. آینه یا لیزر را با دستگیرهٔ گردش بچرخانید؛ دو زاویه همیشه برابر می‌مانند.","Angle of incidence":"زاویهٔ تابش","Angle of reflection":"زاویهٔ بازتاب","Refraction (Snell's law)":"شکست نور (قانون اسنل)","A laser enters a glass block at 40°. The angle inside the glass is measured right at the surface.":"باریکهٔ لیزر با زاویهٔ 40° وارد تیغهٔ شیشه‌ای می‌شود. زاویهٔ درون شیشه درست در سطح اندازه‌گیری می‌شود.","Angle in air θ₁":"زاویه در هوا θ₁","Formula θ₂":"θ₂ فرمول","Model θ₂":"θ₂ شبیه‌سازی","Total internal reflection":"بازتاب کلی","Above θc = arcsin(1/n) no light escapes":"بالاتر از θc = arcsin(1/n) هیچ نوری بیرون نمی‌رود","The laser aims at the centre of a glass half-disc, so it enters the curved side without bending and meets the flat face at 50°. Drag the laser round the curve to cross the critical angle.":"لیزر به مرکز نیم‌استوانهٔ شیشه‌ای نشانه رفته؛ پس بدون شکست از سطح خمیده وارد می‌شود و با زاویهٔ 50° به سطح تخت می‌رسد. لیزر را دور سطح خمیده بکشید تا از زاویهٔ حد بگذرد.","Critical angle θc":"زاویهٔ حد θc","Angle at flat face":"زاویه در سطح تخت",Result:"نتیجه","Refracted out":"شکست و خروج","Focal point of a lens":"کانون عدسی همگرا","Parallel rays meet at F, a distance f behind the lens":"پرتوهای موازی در کانون F به فاصلهٔ f پشت عدسی به هم می‌رسند","Five parallel rays pass a converging lens with f = 6 cm. Where each ray crosses the axis is measured.":"پنج پرتو موازی از عدسی همگرا با f = 6 cm می‌گذرند. جایی که هر پرتو محور را قطع می‌کند اندازه‌گیری می‌شود.","Lens equation":"معادلهٔ عدسی","A point source 8 cm from a lens with f = 5 cm. The rays meet again at the image, where the screen stands.":"یک چشمهٔ نقطه‌ای در فاصلهٔ 8 cm از عدسی با f = 5 cm قرار دارد. پرتوها در محل تصویر دوباره به هم می‌رسند و پرده همان‌جاست.","Object distance d₀":"فاصلهٔ جسم d₀","Parallel rays reflect from a concave mirror with R = 16 cm and cross the axis at the focal point.":"پرتوهای موازی از آینهٔ کاو با R = 16 cm بازمی‌تابند و محور را در کانون قطع می‌کنند.","Dispersion in a prism":"پاشندگی نور در منشور","n is larger for violet than for red, so violet bends more":"n برای نور بنفش بیشتر از قرمز است؛ پس بنفش بیشتر می‌شکند","White light enters a flint-glass prism and fans out into a spectrum. The deviation of red and violet is measured.":"نور سفید وارد منشور شیشهٔ فلینت می‌شود و به طیف رنگ‌ها باز می‌شود. انحراف نور قرمز و بنفش اندازه‌گیری می‌شود.","Deviation red":"انحراف قرمز","Deviation violet":"انحراف بنفش","Wavelength of sound":"طول موج صوت","A 3 kHz speaker in air, where v = 343 m/s. Sound is slowed about 4,300× so each crest is visible; the spacing between crests is measured.":"بلندگوی 3 kHz در هوا که در آن v = 343 m/s است. صوت حدود 4300 برابر آهسته شده تا هر قله دیده شود؛ فاصلهٔ قله‌ها اندازه‌گیری می‌شود.","Sound level and distance":"تراز شدت صوت و فاصله","Double the distance: ΔL = −20 log₁₀(r₂/r₁) ≈ −6 dB":"با دو برابر شدن فاصله: ΔL = −20 log₁₀(r₂/r₁) ≈ −6 dB","Two microphones at 4 cm and 8 cm from the speaker. Drag either one: the difference follows the formula.":"دو میکروفون در فاصلهٔ 4 cm و 8 cm از بلندگو. هر کدام را بکشید؛ اختلاف تراز از فرمول پیروی می‌کند.","Level near":"تراز نزدیک","Level far":"تراز دور","Formula ΔL":"ΔL فرمول","Model ΔL":"ΔL شبیه‌سازی","Interference of two speakers":"تداخل دو بلندگو","Path difference 0: loud · λ/2: quiet":"اختلاف راه 0: صدای بلند · λ/2: صدای آرام","Two speakers play the same 3 kHz tone in step. M1 is equally far from both; M2 is half a wavelength farther from one. Move a microphone to find other loud and quiet spots.":"دو بلندگو یک صدای 3 kHz را هم‌فاز پخش می‌کنند. فاصلهٔ M1 از هر دو برابر است و M2 نیم‌طول‌موج از یکی دورتر است. میکروفون‌ها را جابه‌جا کنید تا نقطه‌های بلند و آرام دیگر را پیدا کنید.","Path difference at M1":"اختلاف راه در M1","Level at M1":"تراز در M1","Path difference at M2":"اختلاف راه در M2","Level at M2":"تراز در M2","Doppler effect":"اثر دوپلر","Approaching source: f′ = f · v / (v − vₛ)":"چشمهٔ نزدیک‌شونده: f′ = f · v / (v − vₛ)","A 2 kHz speaker moves toward the microphone at 120 m/s. Crests bunch up in front of it, so the microphone hears a higher pitch.":"بلندگویی با بسامد 2 kHz با تندی 120 m/s به سمت میکروفون حرکت می‌کند. قله‌ها جلوی آن فشرده می‌شوند و میکروفون بسامد بالاتری می‌شنود.","Emitted f":"f گسیل‌شده",Magnetism:"مغناطیس","Magnets, iron, compasses and currents":"آهنربا، آهن، قطب‌نما و جریان","Drag the compass around the magnet, then pull the paperclip close. Add more from the tray below.":"قطب‌نما را دور آهنربا بکشید، سپس گیره را نزدیک کنید. از سینی پایین وسایل بیشتری اضافه کنید.","Electric fields":"میدان الکتریکی","Charges, field lines and potential":"بار، خطوط میدان و پتانسیل","Drag a charge and watch the field lines follow. Pith balls are light and move; the metal spheres stay where you put them.":"یک بار را بکشید و ببینید خطوط میدان چطور دنبالش می‌آیند. گوی‌های سبک حرکت می‌کنند؛ کره‌های فلزی همان‌جا که می‌گذارید می‌مانند.","Charged particles":"ذرات باردار","Electrons and ions in E and B fields":"الکترون و یون در میدان‌های E و B","Tap the gun to fire. Select the field region to change its strength or direction.":"برای شلیک روی تفنگ بزنید. ناحیهٔ میدان را انتخاب کنید تا شدت یا جهتش را تغییر دهید.","Motion & collisions":"حرکت و برخورد","Gravity, springs, pendulums and impacts":"گرانش، فنر، آونگ و ضربه","Throw the ball at the block. Every hit shows the speed change, impulse, average force and acceleration.":"توپ را به سمت قطعه پرتاب کنید. هر برخورد تغییر تندی، ضربه، نیروی میانگین و شتاب را نشان می‌دهد.",Optics:"نورشناسی","Mirrors, lenses, prisms and light rays":"آینه، عدسی، منشور و پرتوهای نور","Drag the lens and watch the rays bend. Turn any source or mirror with its round handle.":"عدسی را بکشید و خم شدن پرتوها را ببینید. هر چشمه یا آینه را با دستگیرهٔ گردش بچرخانید.",Sound:"صوت","Waves, loudness, interference and Doppler":"موج، بلندی صدا، تداخل و دوپلر","Sound is slowed about 4,300× so you can watch it travel. Move the microphone to find loud and quiet spots.":"صوت حدود 4300 برابر آهسته شده تا حرکتش را ببینید. میکروفون را جابه‌جا کنید تا جاهای بلند و آرام را پیدا کنید.","Physics labs in 2D · real units, live checks":"آزمایشگاه فیزیک دوبعدی · یکاهای واقعی، سنجش زنده",Labs:"آزمایشگاه‌ها","Coming next":"به‌زودی","Electric circuits":"مدار الکتریکی","Ohm, Kirchhoff and RC timing":"قانون اهم، کیرشهف و مدار RC","Heat & gases":"گرما و گازها","Calorimetry, gas laws and engines":"گرماسنجی، قانون‌های گاز و ماشین گرمایی",Fluids:"شاره‌ها","Pressure, buoyancy and Bernoulli":"فشار، شناوری و برنولی","Modern physics":"فیزیک جدید","Photoelectric effect, atoms and decay":"اثر فوتوالکتریک، اتم و واپاشی","{n} experiments":"{n} آزمایش","{n} verified":"{n} تأییدشده","Feel the forces.":"نیروها را لمس کنید.","Demo preview · 3-day access":"نسخهٔ نمایشی · دسترسی سه‌روزه","Access key":"کلید دسترسی",Unlock:"ورود","Connecting…":"در حال اتصال…","Enter a key.":"یک کلید وارد کنید.","That key is not vali ند!","con-first":"تبریک! اولین آزمایش شما تأیید شد","con-lab":"تبریک! همهٔ آزمایش‌های {$l} را تأیید کردید","con-all":"تبریک! شما همهٔ آزمایش‌ها را تمام کردید؛ فیزیک‌دان بزرگ!","con-regular":"تبریک! سومین بار است که برمی‌گردید"},EN={model1:"Magnets use the magnetic-pole model: each pole face carries q = Br·A/μ₀, so a pole gives 1/r² and a whole magnet gives the 1/r³ dipole field far away. Iron and steel magnetise in the local field (m = χ·V·B/μ₀, capped at saturation), which is why they always attract. Wires carry current out of or into the screen: B = μ₀I/2πr.",model2:"Charges follow Coulomb's law; plates give a uniform E = V/d. Electrons, protons and alpha particles move with F = q(E + v×B) on their own slow-motion clock, so nanosecond paths become visible. Bodies collide with impulses and, in table view, feel static and sliding friction. Everything is 2D: forces that would point out of the screen are not shown.",model3:"Light travels as rays: mirrors reflect, glass refracts by Snell's law with an index that depends on colour, and thin lenses bend each ray by the height where it lands. Sound is a pressure wave at 343 m/s, slowed about 4,300× so you can watch it; waves from several speakers add up, so they can also cancel.","egg-spark":"Easter egg: you found Einstein's spark!","egg-owl":"Easter egg: night-owl physicist!","egg-crowd":"Easter egg: crowded lab, 15 things on the table!","egg-bounce":"Easter egg: 25 impacts, Newton would be proud!","con-first":"Congratulations! Your first verified experiment","con-lab":"Congratulations! You verified every {$l} experiment","con-all":"Congratulations! Every experiment done: grand physicist!","con-regular":"Congratulations! Your third visit"};function faD(e){return String(e).replace(/[0-9]/g,function(e){return"۰۱۲۳۴۵۶۷۸۹"[e]})}function T(e,t){var a="fa"===LANG&&FA[e]||EN[e]||e;if(t)for(var r in t)a=a.split("{"+r+"}").join("$"===r.charAt(0)?t[r]:"fa"===LANG?faD(t[r]):String(t[r]));return a}function applyDir(){var e=document.
