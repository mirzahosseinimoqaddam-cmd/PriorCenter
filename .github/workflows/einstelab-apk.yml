name: EinsteLab APK

on:
  push:
    paths:
      - 'einstelab/**'
      - '.github/workflows/einstelab-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: bash einstelab/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EinsteLab-apk
          path: einstelab/android/EinsteLab.apk
      - name: Publish as the latest test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete einstelab-latest --yes --cleanup-tag || true
          gh release create einstelab-latest einstelab/android/EinsteLab.apk \
            --target "${{ github.sha }}" --prerelease --title "EinsteLab (test build ${{ github.run_number }})" \
            --notes "Test build of EinsteLab. Opens only with an access key; each key works for 3 days on this phone."
