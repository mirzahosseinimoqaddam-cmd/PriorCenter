name: EinsteLab apps

on:
  push:
    paths:
      - 'einstelab/**'
      - '.github/workflows/einstelab-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: bash einstelab/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: einstelab/android/EinsteLab.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        working-directory: einstelab/ios
        run: |
          brew install xcodegen
          cp ../android/assets/index.html Resources/index.html
          xcodegen generate
          xcodebuild -project EinsteLab.xcodeproj -scheme EinsteLab -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/EinsteLab.app Payload/
          zip -qr EinsteLab.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: einstelab/ios/EinsteLab.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish as the latest test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete einstelab-latest --yes --cleanup-tag || true
          gh release create einstelab-latest android/EinsteLab.apk ios/EinsteLab.ipa \
            --target "${{ github.sha }}" --prerelease --title "EinsteLab (test build ${{ github.run_number }})" \
            --notes "Test build of EinsteLab for Android (APK) and iPhone (unsigned IPA, install with Sideloadly or AltStore). Opens only with an access key; each key works for 3 days on the device."
