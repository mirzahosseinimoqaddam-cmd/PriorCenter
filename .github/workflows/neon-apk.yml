name: NEON app

on:
  push:
    paths:
      - 'neon/**'
      - '.github/workflows/neon-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Play every game headless (no crashes, no broken drawing)
        run: node neon/web/test.js
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 3.0.${{ github.run_number }}
          # optional repository secrets for the real release key (see neon/store/LAUNCH.md)
          NEON_KEYSTORE_B64: ${{ secrets.NEON_KEYSTORE_B64 }}
          NEON_KEY_PASS: ${{ secrets.NEON_KEY_PASS }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
        run: bash neon/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: neon/android/Neon.apk
      - name: Publish as the latest test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete neon-latest --yes --cleanup-tag || true
          gh release create neon-latest neon/android/Neon.apk \
            --target "${{ github.sha }}" --prerelease --title "NEON (test build ${{ github.run_number }})" \
            --notes "NEON: 370 neon line games for Android. Streaks, levels, trophies and smart reminders. Make and mix your own. Fully offline."
      - name: Build Play Store bundle (AAB)
        continue-on-error: true
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 3.0.${{ github.run_number }}
          NEON_KEYSTORE_B64: ${{ secrets.NEON_KEYSTORE_B64 }}
          NEON_KEY_PASS: ${{ secrets.NEON_KEY_PASS }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
        run: bash neon/android/build.sh --aab
      - name: Attach the bundle to the release
        if: hashFiles('neon/android/Neon.aab') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload neon-latest neon/android/Neon.aab --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-store-bundle
          path: neon/android/Neon.aab
          if-no-files-found: ignore
